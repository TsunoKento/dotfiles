# シンボリックリンク設定
# 形式: src:dst
# src は DOTFILES_DIR からの相対パス、dst は絶対パス
.config/zsh/.zshrc:${HOME}/.zshrc
.config/starship/starship.toml:${HOME}/.config/starship.toml
.config/claude/settings.json:${HOME}/.claude/settings.json
.config/wezterm/wezterm.lua:${HOME}/.config/wezterm/wezterm.lua
.config/wezterm/keybinds.lua:${HOME}/.config/wezterm/keybinds.lua
